<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Audiovisual</title>
    <!-- Importamos una tipografía moderna y limpia estilo minimalista -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAFAFA;
            --text-main: #1A1A1A;
            --text-muted: #737373;
            --card-bg: #FFFFFF;
            --border-color: #E5E5E5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        p {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Proporción 16:9 */
            background-color: #000;
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            padding: 24px;
            text-align: left;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .video-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Visión en Movimiento</h1>
            <p>Estética limpia, minimalista y enfocada en la alta producción.</p>
        </header>

        <div class="video-card">
            <!-- Aquí puedes incrustar tu video (ej. de YouTube o un archivo de video propio) -->
            <div class="video-container">
                <!-- Ejemplo con un video de muestra, puedes cambiar la URL del iframe por la tuya -->
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Showreel" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <div class="video-title">Proyecto Destacado</div>
                <div class="video-desc">Dirección de fotografía y edición de alto impacto visual.</div>
            </div>
        </div>
    </div>

</body>
</html>
